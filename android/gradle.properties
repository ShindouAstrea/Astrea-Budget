# Memoria del daemon de Gradle. 8G de heap + 4G de metaspace ahogaban una
# máquina de 16 GB con el IDE abierto: el daemon se quedaba esperando memoria
# física y el build parecía colgado. Estos valores son los del template de
# Flutter, algo más conservadores.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# El compilador de Kotlin corre en su propio proceso: también se le pone techo.
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
